version: 2

builds:
  - id: gshocksrv
    main: .
    binary: gshocksrv
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm

  - id: gshocksrv-darwin
    main: .
    binary: gshocksrv
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
